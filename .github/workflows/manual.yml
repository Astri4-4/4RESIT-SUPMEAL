name: Deploy to homelab

on:
  push:
    branches: [master]        # adjust if your default branch is actually "main"
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to deploy'
        required: false
        default: 'latest'
        type: string

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ env.OWNER_LC }}/supmeal:${{ inputs.tag || 'latest' }}

  deploy:
    needs: build-and-push
    runs-on: [self-hosted, homelab]
    steps:
      - name: Redeploy
        run: |
          cd /opt/supmeal
          docker compose pull
          docker compose up -d
