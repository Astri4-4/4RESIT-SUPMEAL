services:
    app:
        build:
            dockerfile: Dockerfile
            context: ./server
        depends_on:
            -  db
            -  redis
        container_name: my_app
        ports:
            - "3000:3000"
        volumes:
            - ./server:/app
            - /app/node_modules
        env_file:
            - ./server/.env

    db:
        image: postgres:18-alpine
        container_name: db
        env_file:
            -   ./db/.env
        ports:
            - "5432:5432"
        volumes:
            - ./db:/var/lib/postgresql

    redis:
        image: redis:7-alpine
        container_name: my_redis
        ports:
            - "6379:6379"
        volumes:
            - ./redis:/data
        command: redis-server --appendonly yes

volumes:
    db_data:
    redis_data: